name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install project Android platform
        shell: bash
        run: |
          COMPILE_SDK=$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["compileSdk"])')
          set -o pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-${COMPILE_SDK}" 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Debug builds use Android's generated debug keystore, not upstream secrets.
      - name: Build stable debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleStableDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Report build failure details
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/gradle-build.log`;
            if (fs.existsSync(path)) {
              core.error(fs.readFileSync(path, 'utf8').slice(-50000));
            }

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cloudstream-debug-${{ github.run_number }}
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
