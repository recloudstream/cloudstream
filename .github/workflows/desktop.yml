name: Desktop Build

# Checks a pull request: the tests, and that the desktop app compiles. Nothing runs on the merge
# itself, the pull request was checked already. The installer is only built when the workflow is
# run by hand ("Run workflow" in the Actions tab), to try a build before releasing it.

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/workflows/libmpv.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops the check of the commit before it
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Run tests
      run: ./gradlew :library:jvmTest :shared:jvmTest :desktopApp:jvmTest

    - name: Build MSI
      if: github.event_name == 'workflow_dispatch'
      run: ./gradlew :desktopApp:packageMsi

    - name: Upload MSI
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v7
      with:
        name: desktop-windows-msi
        path: desktopApp/build/compose/binaries/main/msi/*.msi
        if-no-files-found: error

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: desktop-test-reports
        path: |
          library/build/reports/tests/jvmTest/
          shared/build/reports/tests/jvmTest/
          desktopApp/build/reports/tests/jvmTest/
