name: Desktop Installers

# Builds the desktop app installers for macOS, Windows and Linux.
# Push a tag like `desktop-v4.8.0` to also publish them as a GitHub release.
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["desktop-v*"]
    paths:
      - "desktopApp/**"
      - "shared/**"
      - "library/**"
      - "gradle/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktopApp/**"
      - "shared/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            tasks: packageDmg
          - name: macos-x64
            os: macos-15-intel
            tasks: packageDmg
          - name: windows-x64
            os: windows-latest
            tasks: packageMsi packageExe
          - name: linux-x64
            os: ubuntu-latest
            tasks: packageDeb packageRpm

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # jpackage builds the installer with the JDK that runs Gradle, and bundles its runtime
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build installers
        shell: bash
        run: |
          chmod +x gradlew
          tasks=""
          for task in ${{ matrix.tasks }}; do tasks="$tasks :desktopApp:$task"; done
          ./gradlew $tasks --no-configuration-cache

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: CloudStream-${{ matrix.name }}
          path: |
            desktopApp/build/compose/binaries/main/dmg/*.dmg
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installers

      # Installers from different architectures share a file name, so prefix them with the build name
      - name: Name installers by platform
        run: |
          mkdir release
          for dir in installers/*/; do
            name=$(basename "$dir")
            find "$dir" -type f | while read -r file; do
              cp "$file" "release/${name}-$(basename "$file")"
            done
          done
          ls -la release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Unsigned builds. VLC must be installed for the built-in player.
            macOS: if it says the app is damaged, run `xattr -cr /Applications/CloudStream.app`.
            Windows: SmartScreen may warn, choose "More info" → "Run anyway".
