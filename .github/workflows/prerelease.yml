
name: Pre-release

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'

concurrency:
  group: "pre-release"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build APK
      run: ./gradlew assemblePrereleaseRelease assemblePrereleaseDebug androidSourcesJar makeJar

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: CloudStream-APK
        path: |
          app/build/outputs/apk/prerelease/**/*.apk
          app/build/libs/app-sources.jar
          app/build/classes.jar
        if-no-files-found: error

    - name: Create pre-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: pre-release
        name: CloudStream Private Build
        prerelease: true
        files: |
          app/build/outputs/apk/prerelease/**/*.apk
          app/build/libs/app-sources.jar
          app/build/classes.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
