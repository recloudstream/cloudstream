name: Release

# Publishes the Windows app, only when asked: merges into master publish nothing, so they cost no
# build of their own.
#
# - "Run workflow" in the Actions tab, on master, publishes a pre-release, v<version>-beta.<n>,
#   where <version> is versionName in gradle/libs.versions.toml and <n> follows the last beta of
#   that version. Installed apps find it through the update check in Settings.
# - Pushing a tag v<version> publishes that version as a full release. A tag with a suffix, such as
#   v4.8.0-rc.1, makes a pre-release. After a full release, raise versionName before the next beta:
#   it would otherwise come before the release itself.
#
# The release holds the installer, and its notes link to the libmpv release the build downloads
# libmpv-2.dll from, which holds the dll's complete source, as THIRD-PARTY-NOTICES.txt says. The
# source is not copied into every release: it is 462 MB, the same each time.

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

# One release at a time, so two runs close together never pick the same beta number
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6

    - name: Only master or a tag
      if: github.ref_type != 'tag' && github.ref != 'refs/heads/master'
      run: |
        echo "::error::Run the release on master, or push a v tag. $GITHUB_REF would publish a branch that was not merged"
        exit 1

    - name: Choose the version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(grep -E '^versionName' gradle/libs.versions.toml | cut -d'"' -f2)
        if [[ "$GITHUB_REF_TYPE" == tag ]]; then
          tag=$GITHUB_REF_NAME
          if [[ "${tag#v}" != "$version" && "${tag#v}" != "$version-"* ]]; then
            echo "::error::Tag $tag does not match versionName $version in gradle/libs.versions.toml"
            exit 1
          fi
        else
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released. Raise versionName in gradle/libs.versions.toml so the next betas come after it"
            exit 1
          fi
          last=$(git ls-remote --tags origin "refs/tags/v$version-beta.*" | sed -E 's|.*/v[^-]*-beta\.([0-9]+)$|\1|' | { grep -E '^[0-9]+$' || true; } | sort -n | tail -1)
          tag=v$version-beta.$(( ${last:-0} + 1 ))
        fi
        # The changes listed in the notes start from the last app release
        previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 50 --json tagName -q '.[].tagName' | grep -E '^v[0-9]' | grep -vx "$tag" | head -1 || true)
        echo "Releasing $tag, changes since ${previous:-the start}"
        echo "TAG=$tag" >> "$GITHUB_ENV"
        echo "PREVIOUS=$previous" >> "$GITHUB_ENV"

    # Before the build, so a release never goes out without the source it links to. Only the list of
    # files is read, the source itself stays where it is
    - name: Find the source of the bundled libmpv
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        libmpv=$(grep -o 'releases/download/[^/"]*' desktopApp/build.gradle.kts | head -1 | cut -d/ -f3)
        echo "libmpv comes from release $libmpv"
        assets=$(gh release view "$libmpv" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
        echo "$assets"
        if ! grep -q -- '-source.7z.001$' <<< "$assets"; then
          echo "::error::Release $libmpv has no libmpv source. Build libmpv with the libmpv workflow (publish) and point desktopApp/build.gradle.kts at it"
          exit 1
        fi
        echo "LIBMPV=$libmpv" >> "$GITHUB_ENV"

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        # Releases run on master or a tag: their cache serves the pull requests' checks
        cache-read-only: false

    - name: Run tests
      run: ./gradlew :library:jvmTest :shared:jvmTest

    # The app knows its full version, pre-release included, for the update check. The MSI version
    # takes the run number as its last part: Windows only upgrades to a higher MSI version, and two
    # releases of one version, such as 4.8.0-beta.1 and 4.8.0-beta.2, must still upgrade
    - name: Build MSI
      run: |
        version=${TAG#v}
        core=${version%%-*}
        ./gradlew :desktopApp:packageMsi -PappVersion=$version -PmsiVersion=${core%.*}.$GITHUB_RUN_NUMBER

    # Creates the tag on the merged commit when there is none yet
    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        msi=$(ls desktopApp/build/compose/binaries/main/msi/*.msi)
        prerelease=$([[ "$TAG" == *-* ]] && echo --prerelease || true)
        {
          echo "CloudStream for Windows ${TAG#v}."
          echo
          echo "Download \`$(basename "$msi")\` and open it to install, or to update an installed version. Installed apps also find this release in Settings."
          echo
          echo "SHA-256 of the installer: \`$(sha256sum "$msi" | cut -d' ' -f1)\`"
          echo
          echo "The complete source of the libmpv-2.dll the app plays video with (GPL, see THIRD-PARTY-NOTICES.txt) is in the [$LIBMPV](https://github.com/$GITHUB_REPOSITORY/releases/tag/$LIBMPV) release: the \`*-source.7z.*\` files, with the list of every library's version in \`*-sources.txt\`."
        } > notes.md
        gh release create "$TAG" "$msi" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --title "CloudStream ${TAG#v}" --notes-file notes.md --generate-notes \
          ${PREVIOUS:+--notes-start-tag "$PREVIOUS"} $prerelease
